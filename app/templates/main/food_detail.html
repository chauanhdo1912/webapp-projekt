{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 700px;">
    <div class="card shadow-sm border-0 p-4">
        <h1 class="fw-bold mb-3 text-dark">{{food.foodname}}</h1>
        <div class="mb-3">
            <span class="badge bg-secondary fs-6 px-3 py-2">{{food.category}}</span>
        </div>
        <h3 class="text-danger fw-bold mb-4">{{"{:,.0f}".format(food.price)}}€</h3>
        <hr>
        <h5 class="fw-bold text-muted mt-3">Detail: </h5>
        <p class="fs-5 text-secondary mb-5" style="white-space: pre-line;">{{food.description}}</p>

        <div class="d-flex gap-2 align-items-center flex-wrap">
            <a href="{{url_for('admin.edit_food', id=food.id)}}" class="btn btn-outline-secondary px-4">Edit</a>

            <form action="{{url_for('admin.delete_food', id=food.id)}}" method="POST" onsubmit="return confirm('Are you sure that you want to delete?');" class="d-inline">
                <button type="submit" class="btn btn-danger px-4">Delete</button>
            </form>
            <a href="{{url_for('main.index')}}" class="btn btn-primary px-4">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
