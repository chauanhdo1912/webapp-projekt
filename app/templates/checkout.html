{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-4">
                <h2 class="fw-bold mb-4 text-center">Checkout</h2>

                <form action="{{url_for('main.check_out')}}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control" id="cus_name" name="cus_name" value="{{last_order.cus_name}}" required placeholder="Enter your full name">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" id="cus_email" name="cus_email" value="{{last_order.cus_email}}" required placeholder="Your Email">
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label fw-bold">Phone Number</label>
                        <input type="text"  class="form-control" id="cus_phone" name="cus_phone" value="{{last_order.cus_phone}}" required placeholder="Your phone number">
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-bold">Delivery Address</label>
                        <input type="text" class="form-control" id="cus_address" name="cus_address" value="{{last_order.cus_address}}" required placeholder="Your address">
                    </div>
                    
                    <div class="card bg-light border-0 p-3 mb-4">
                        <div class="d-flex justify-content-center fs-5">
                            <span class="fw-bold">Total to Pay: </span>
                            <strong class="text-danger">{{"{:,.0f}".format(total_price)}}€</strong>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">Confirm Order</button>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
